services:
  myapi-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: myapi-hub:latest
    container_name: myapi-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8792:8792"
    environment:
      - PORT=8792
      - MYAPI_CONFIG=/app/channels.json
      - TZ=Asia/Shanghai
    volumes:
      # 渠道配置只读挂载，改完在面板点「重载配置」或重建容器
      - ./channels.json:/app/channels.json:ro
      # 统计与任务状态
      - ./data:/app/data
    extra_hosts:
      # 让容器能访问宿主机上的 trae2api-hub / wb-proxy / proxy-hub
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8792)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
